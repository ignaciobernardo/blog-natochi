<meta name="description" content="A moving celestial vector chart, drawn in white on black.">

<canvas tabindex="0" role="img" aria-label="Animated celestial vector chart. Fine white curved coordinates and chalk-like arrows on black. Click or press Space to pause the movement."></canvas>
