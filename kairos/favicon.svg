<!--
  The Kairos mark, cream on Purple/900, full bleed.

  A tab icon is a 16px square, so this is not the site's lockup shrunk: the
  mark carries its own ground instead of sitting transparent, because a
  transparent mark disappears against a dark browser chrome and against the
  page it is pinned next to. The stroke is drawn at 4.0 rather than the
  lockup's 3.01 — at tab size the drawn weight is what survives, not the
  shape — and the tile is padded tight for the same reason.

  Regenerate from public/assets/icons/kairos-mark.svg, which is the source of
  truth for the mark; the vertical flip matches how Logo.astro draws it.
-->
