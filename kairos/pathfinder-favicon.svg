<!--
  The Pathfinder tab mark: the isotype in Pathfinder Red/50 on a full-bleed
  Red/200 tile.

  Full-bleed rather than a transparent mark, for the same reason as the Kairos
  and SPAR ones: a tab strip can be light or dark, and a mark that borrows its
  background from the browser loses its shape on one of them.

  The source is public/assets/pathfinder/icon-pathfinder.svg, whose artwork
  spans 0..25.3 by 0..27.4 including its 2.379 stroke. The viewBox pads that so
  the mark takes about 81% of the tile — the proportion the other two use.
  Stroke weight is the source's, unchanged.

  Regenerate the rasters after editing:
    node scripts/raster-pathfinder-favicon.mjs
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3 -2 31.3 31.4" width="31.3" height="31.4">
  <rect x="-3" y="-2" width="31.3" height="31.4" fill="#e3413b"/>
  <g fill="none" stroke="#ffeeee" stroke-width="2.37941" stroke-miterlimit="10">
