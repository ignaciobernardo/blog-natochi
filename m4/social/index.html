e"></label><label data-for="accepted">Track or role<input data-field="track"></label><label data-for="carousel">Last slide status<input data-field="status"></label><label>Link or call to action<input data-field="cta"></label></fieldset><fieldset data-for="open countdown"><legend class="gs-label">Dates</legend><label>Deadline <small data-for="open">optional</small><input type="date" data-field="deadline"></label><label data-for="countdown">Post date <small>the day it goes out</small><input type="date" data-field="postDate"></label><label data-for="countdown">Days applications are open<input type="number" min="1" max="120" data-field="windowDays"></label></fieldset><fieldset><legend class="gs-label">Layers</legend><div class="checks"><label><input type="checkbox" data-toggle="ceiling">Ceiling grid</label><label><input type="checkbox" data-toggle="floor">Floor grid</label><label><input type="checkbox" data-toggle="tiles">Lit tiles</label><label><input type="checkbox" data-toggle="grain">Grain</label><label><input type="checkbox" data-toggle="logo">Logo</label><label data-for="accepted"><input type="checkbox" data-toggle="headshot">Photo</label></div></fieldset><fieldset><legend class="gs-label">Move the grid <small>or drag on the post</small></legend><label>Floor up / down<input type="range" min="-50" max="50" step="1" data-move="floorY"></label><label>Ceiling up / down<input type="range" min="-50" max="50" step="1" data-move="ceilY"></label><label>Vanishing point left / right<input type="range" min="-50" max="50" step="1" data-move="vanX"></label><button type="button" class="ghost" data-reset-grid>Centre the grid</button></fieldset><button type="button" class="ghost" data-reset>Reset this template's text</button></aside><main class="view"><div class="view-bar"><span class="gs-micro" data-size></span><div class="view-actions"><button type="button" class="ghost" data-for-series data-export-series>Countdown series</button><button type="button" class="ghost" data-export-slides hidden>Slides as PNG</button><button type="button" class="ghost" data-export-pdf hidden>Download PDF</button><button type="button" class="ghost" data-export-all>All sizes</button><button type="button" class="primary" data-export>Download PNG</button></div></div><div class="view-stage" data-stage><div class="box" data-box><div class="scaler" data-scaler><div class="post" data-post></div></div></div></div></main></div><script type="application/json" id="social-data">{"photos":[{"src":"/m4/social/photos/cy-22.webp","alt":"The cohort in the seminar room during a talk","caption":"London · week one"},{"src":"/m4/social/photos/cy-6.webp","alt":"Fellows laughing during a session","caption":"London · week one"},{"src":"/m4/social/photos/cy-51.webp","alt":"Fellows at lunch in the dining hall","caption":"London · lunch"},{"src":"/m4/social/photos/cy-30.webp","alt":"A fellow raises a hand during a talk on adversarial attacks","caption":"Talks"},{"src":"/m4/social/photos/cy-34.webp","alt":"Working through a problem on the whiteboard","caption":"Whiteboard"},{"src":"/m4/social/photos/cy-12.webp","alt":"Fellows listening in the front row","caption":"Discussion"},{"src":"/m4/social/photos/cy-44.webp","alt":"A fellow working at a desk with two monitors","caption":"Heads-down time"},{"src":"/m4/social/photos/cy-45.webp","alt":"A fellow working at a desk, smiling at the screen","caption":"Heads-down time"},{"src":"/m4/social/photos/cy-50.webp","alt":"Fellows working in quiet booths","caption":"Quiet booths"},{"src":"/m4/social/photos/cy-20.webp","alt":"A speaker presenting to the cohort","caption":"Presenting · week one"},{"src":"/m4/social/photos/cy-37.webp","alt":"A speaker answering questions","caption":"Q&A · week one"},{"src":"/m4/social/photos/cy-16.webp","alt":"Fellows listening during a session","caption":"The cohort"},{"src":"/m4/social/photos/cy-41.webp","alt":"Portrait of a fellow on a green sofa","caption":"Cohort 01"},{"src":"/m4/social/photos/cy-42.webp","alt":"Portrait of a fellow smiling","caption":"Cohort 01"},{"src":"/m4/social/photos/cy-43.webp","alt":"Portrait of a fellow on a green sofa, smiling","caption":"Cohort 01"}],"cohort2":{"name":"Cohort 02","place":"Bay Area","weekOne":"January 23–31, 2027"},"cohort1":{"fellows":7,"avgYearsSecurity":8.6,"signals":[{"label":"Have a concrete AI safety workstream","value":7,"n":7},{"label":"Rated the in-person week 9/10 or higher","value":6,"n":7},{"label":"Say the week saved them 3+ months","value":6,"n":7},{"label":"Say 6+ months, or they would not have got there","value":3,"n":7},{"label":"Already doing paid safety work","value":2,"n":7}],"understanding":{"before":3.14,"after":4.57,"max":5},"tracks":[{"track":"Joined a safety org","what":"Advising an AI evaluation organisation, and writing an incident-response playbook for AI agent failures as a public repo and write-up.","status":"Role landed · playbook in progress"},{"track":"Paid fieldbuilding","what":"Contracting for Kairos to bring cyber talent into the field. Recruited about 14 judges in three days for an AI incident-response sprint.","status":"Contract landed · co-founding an org"},{"track":"Co-founding","what":"“Airgap the AI”: a working OT simulation on local models, now being deployed, and a critical-infrastructure research org that grew out of it.","status":"Prototype built · org in drafting"},{"track":"Founding","what":"Ex-Apple security engineer. Pivoted an AI security startup toward catastrophic-risk work and is applying for nonprofit funding instead of raising VC.","status":"Pivot done · application in progress"},{"track":"Technical research","what":"Adaptive scheming over long trajectories: nine configurations, three monitor types by three levels of agent awareness.","status":"In progress · repo and paper"},{"track":"Technical research","what":"Whether agents defer to human authorization based on how competent the principal seems, across 3B, 7B and 70B open models.","status":"In progress · repo and paper"},{"track":"Policy","what":"An explainer on catastrophic risk from commercially driven cyber AI, circulated to policy groups, plus an offensive-cyber practitioner workshop.","status":"Draft circulated · workshop run"}],"changes":[{"title":"Longer selection","body":"Outreach starts two to three months ahead, and every candidate does at least two interviews and a take-home."},{"title":"Time to say yes","body":"A much longer window to accept, get employer authorization and sort visas."},{"title":"Pods","body":"Twenty fellows split into small groups that work and meet together, so the peer dynamic that worked at seven holds."},{"title":"Employer track","body":"A pilot of accelerated interviews and project ideas hiring orgs accept as work trials. M3 stays independent, not a hiring pipeline."}]},"problems":[{"name":"Compute governance","lead":"Training compute is the one input to frontier AI you can physically count. Nobody has built the accounting for it.","starts":["A credible chip-inventory scheme that a regulator could audit","Metering that survives an operator who wants to under-report","What a threshold means once training is distributed"]},{"name":"Inference verification","lead":"When an API returns an answer, you have no way to check which model produced it.","starts":["Cryptographic proofs of which weights served a request","Statistical fingerprinting that holds under adversarial serving","What a verifiable-inference guarantee should even claim"]},{"name":"Model attestation","lead":"There is no code signature for weights.","starts":["Signing and provenance formats for weights and checkpoints","Detecting post-release tampering and fine-tune drift","Binding a training process to the artefact it produced"]},{"name":"Hardware security","lead":"Every software guarantee eventually bottoms out in an accelerator you did not build.","starts":["Breaking or hardening GPU confidential-computing modes","Side-channel and physical-extraction work on accelerators","What happens when the attestation root itself is the adversary"]},{"name":"Securing model weights","lead":"A frontier model is a few terabytes that a state intelligence service would like to walk out with.","starts":["Exfiltration paths that survive a cooperative insider","Access control that does not collapse under research velocity","Making a published security level actually verifiable"]},{"name":"Treaty verification","lead":"Any international agreement on AI needs parties to check compliance without opening their labs to each other.","starts":["Verification schemes that reveal compliance and nothing else","Hardware-enforced limits a counterparty would accept","Which commitments are checkable at all, and which are theatre"]},{"name":"Agent security","lead":"Agents read untrusted text and then act with real credentials.","starts":["Real trust boundaries between an agent and its tools","Delegation and revocation for credentials an agent holds","Containment and audit after an agent goes off-plan"]},{"name":"Authorization against misuse","lead":"Deciding what a given user may get out of a model is an access-control problem wearing a safety costume.","starts":["Graded capability authorization instead of blanket refusal","Identity and accountability that survive resale and proxying","Audit trails that answer who asked for what, afterwards"]}],"personas":[{"role":"The researcher","summary":"You push the frontier of AI security.","body":"You have a question the field has not answered, a tool AI security needs, or a direction that needs to be explored."},{"role":"The founder","summary":"You see a gap worth an organisation.","body":"A non-profit that governments will need and nobody has built yet. You want the time to scope it, test whether it holds, and leave with something fundable."},{"role":"The field builder","summary":"You want to scale up AI security.","body":"You have spent years inside the area and the bottleneck you see is people, not ideas. You want to build the thing that widens the door."}],"faq":[{"q":"How does the pay work?","a":"You are paid for the hours you put into your project, at your rate, capped at $100 an hour. The build phase starts with one paid month; projects that need more time can extend by two more."},{"q":"What does the first week cost me?","a":"Nothing. We cover flights, hotel, food and anything else you need to be there. Your salary starts after that week, when the build phase begins."},{"q":"Do I have to quit my job?","a":"No. The build phase is remote and runs alongside your job, so you decide how many hours to commit. The only in-person block is the first week, in the Bay Area."},{"q":"Do I need a project going in?","a":"No. Week one exists to find it: mornings reading the field, afternoons letting a small group and field experts try to break your hypothesis. The problems list is where we think the gaps are, and off-list is fine."},{"q":"Who directs the work?","a":"Nobody. A weekly standup with three peers and one facilitator keeps the accountability tight, but the direction stays yours."},{"q":"What happens after demo day?","a":"Papers get routed to workshops and arXiv referrals, tools go to the open source community, and new orgs get introductions to funders. Projects that need more time can extend by two paid months."},{"q":"Who is behind M3?","a":"A collaboration between Constellation, Kairos and AISB. Anything this page does not answer: fernando@m3fellowship.com."},{"q":"What's your relationship with AISB?","a":"M3 is a collaboration between Kairos, Constellation and AISB. M3's first in-person week runs alongside AISB London, giving fellows from both programs access to each other."}]}</script><script type="module" src="/m4/social/assets/social.astro_astro_type_script_index_0_lang.B10UFn7b.js"></script></body></html>
