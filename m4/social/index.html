ows="2" data-field="headline"></textarea></label><label data-for="open">Sub<textarea rows="2" data-field="sub"></textarea></label><label data-for="open">Chips <small>comma separated</small><input data-field="chips"></label><label data-for="photo">Photo label <small>blank: the photo's own</small><input data-field="caption"></label><label data-for="collage">Stat<input data-field="statValue"></label><label data-for="collage">Stat label<input data-field="statLabel"></label><label>Link or call to action<input data-field="cta"></label></fieldset><fieldset data-for="open countdown"><legend class="gs-label">Dates</legend><label>Deadline <small data-for="open">optional</small><input type="date" data-field="deadline"></label><label data-for="countdown">Post date <small>the day it goes out</small><input type="date" data-field="postDate"></label><label data-for="countdown">Days applications are open<input type="number" min="1" max="120" data-field="windowDays"></label></fieldset><fieldset><legend class="gs-label">Layers</legend><div class="checks"><label><input type="checkbox" data-toggle="ceiling">Ceiling grid</label><label><input type="checkbox" data-toggle="floor">Floor grid</label><label><input type="checkbox" data-toggle="tiles">Lit tiles</label><label><input type="checkbox" data-toggle="grain">Grain</label><label><input type="checkbox" data-toggle="logo">Logo</label></div></fieldset><button type="button" class="ghost" data-reset>Reset this template's text</button></aside><main class="view"><div class="view-bar"><span class="gs-micro" data-size></span><div class="view-actions"><button type="button" class="ghost" data-for-series data-export-series>Countdown series</button><button type="button" class="ghost" data-export-all>All sizes</button><button type="button" class="primary" data-export>Download PNG</button></div></div><div class="view-stage" data-stage><div class="box" data-box><div class="scaler" data-scaler><div class="post" data-post></div></div></div></div></main></
