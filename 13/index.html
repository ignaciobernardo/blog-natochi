<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Órbitas, signos y coordenadas suspendidos en un espacio blanco. Una animación generada con código.">
  <title>13 — Órbitas</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
    body { display: grid; place-items: center; }
    canvas { display: block; width: min(100vw, calc(100svh * 600 / 338)); aspect-ratio: 600 / 338; }
  </style>
</head>
<body>
  <canvas role="img" aria-label="Órbitas elípticas de trazos, cifras y pequeñas flechas que se desplazan lentamente sobre un fondo blanco.">Órbitas en movimiento sobre un fondo blanco.</canvas>
  <script src="./orbits.js"></script>
</body>
</html>
