<!--
  The SPAR tab mark: the isotype in Kairos Neutrals/50 on a full-bleed SPAR
  Blue/200 tile.

  Full-bleed rather than a transparent mark, for the same reason as the Kairos
  one: a tab strip can be light or dark, and a mark that borrows its background
  from the browser loses the shape on one of them. Blue/200 is the brand's own
  accent, so the tile reads as SPAR at 16px even when the rosette itself is
  smaller than the glyphs beside it.

  The source is public/assets/spar/icon-spar.svg, whose artwork spans 0..34
  including its stroke. The viewBox pads that by 4 on each side, so the mark
  takes about 81% of the tile — the same proportion the Kairos favicon uses.
  Stroke weight is the source's 3, unchanged.

  Regenerate the rasters after editing:
    node scripts/raster-spar-favicon.mjs
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 42 42" width="42" height="42">
  <rect x="-4" y="-4" width="42" height="42" fill="#008ee7"/>
  <g fill="none" stroke="#fffcf9" stroke-width="3" stroke-linejoin="round">
