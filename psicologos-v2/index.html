<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Grid de psicólogos — prototipo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#fafaf9; --surface:#fff; --ink:#181817; --muted:#82827e; --line:#e6e6e2; --soft:#f0f0ed; --ease:cubic-bezier(.22,1,.36,1); }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--bg); font-family:Inter,system-ui,sans-serif; font-size:14px; }
    button { font:inherit; }
    .page { width:min(860px,calc(100% - 40px)); margin:0 auto; padding:96px 0; }
    .top { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; padding-bottom:22px; border-bottom:1px solid var(--line); }
    h1 { margin:0 0 5px; font-size:1.15rem; font-weight:600; letter-spacing:-.025em; }
    .count { color:var(--muted); font-size:.75rem; }
    .controls { position:relative; display:grid; grid-template-columns:1fr 1fr; width:190px; height:38px; padding:3px; border-radius:12px; background:#efefec; }
    .indicator { position:absolute; top:3px; bottom:3px; left:3px; width:calc(50% - 3px); border:1px solid #e1e1de; border-radius:9px; background:white; box-shadow:0 1px 2px rgba(0,0,0,.04); transform:translateX(0); transition:transform 420ms var(--ease); }
    .controls[data-view="cards"] .indicator { transform:translateX(100%); }
    .view-button { position:relative; z-index:1; border:0; color:#858580; background:transparent; cursor:pointer; font-size:.72rem; }
    .view-button.active { color:var(--ink); }
    .directory { margin-top:20px; }
    .directory.cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .directory.list { display:grid; grid-template-columns:1fr; gap:0; }
    .profile { min-width:0; background:var(--surface); }
    .directory.cards .profile { padding:10px 10px 17px; border:1px solid var(--line); border-radius:17px; }
    .directory.list .profile { display:grid; grid-template-columns:68px minmax(0,1fr) auto; gap:16px; align-items:center; min-height:88px; border-bottom:1px solid var(--line); }
    .portrait { position:relative; overflow:hidden; color:rgba(255,255,255,.88); background:var(--tone); isolation:isolate; }
    .portrait::before,.portrait::after { content:""; position:absolute; border-radius:45% 55% 52% 48%; filter:saturate(.92); }
    .portrait::before { width:72%; aspect-ratio:1; left:-12%; bottom:-22%; background:var(--tone-2); transform:rotate(var(--turn)); }
    .portrait::after { width:66%; aspect-ratio:1; right:-14%; top:-18%; background:var(--tone-3); transform:rotate(calc(var(--turn) * -1)); }
    .initials { position:absolute; z-index:2; right:8%; bottom:-10%; font-size:clamp(2.3rem,7vw,4.8rem); font-weight:600; letter-spacing:-.09em; opacity:.75; }
    .directory.list .portrait { width:68px; height:68px; border-radius:13px; }
    .directory.list .initials { font-size:2rem; bottom:-7%; }
    .directory.cards .portrait { width:100%; aspect-ratio:1.55/1; border-radius:11px; }
    .content { min-width:0; }
    .directory.cards .content { padding:15px 4px 0; }
    .name { margin:0; overflow:hidden; color:var(--ink); font-size:.92rem; font-weight:500; letter-spacing:-.015em; text-overflow:ellipsis; white-space:nowrap; }
    .directory.cards .name { font-size:1rem; }
    .place { margin:5px 0 0; overflow:hidden; color:var(--muted); font-size:.71rem; text-overflow:ellipsis; white-space:nowrap; }
    .focus { color:#60605c; font-size:.72rem; line-height:1.45; }
    .directory.cards .focus { height:42px; margin:13px 0 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .directory.list .focus { margin:4px 0 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .side { display:flex; align-items:center; gap:14px; color:var(--muted); font-size:.71rem; }
    .directory.cards .side { justify-content:space-between; margin:14px 4px 0; padding-top:13px; border-top:1px solid var(--line); }
    .profile-link { color:var(--ink); text-decoration:none; }
    .profile-link:hover { text-decoration:underline; text-underline-offset:3px; }
    .load { display:block; width:100%; height:48px; margin-top:18px; border:1px solid var(--line); border-radius:14px; color:#666661; background:transparent; cursor:pointer; }
    .load:hover { background:white; }
    .hint { margin-top:18px; color:#aaa9a5; text-align:center; font-size:.67rem; }

    ::view-transition-group(root) { animation:none; }
    ::view-transition-group(*) { animation-duration:500ms; animation-timing-function:var(--ease); }
    ::view-transition-old(*),::view-transition-new(*) { mix-blend-mode:normal; animation-duration:500ms; animation-timing-function:var(--ease); }

    @media(max-width:620px){
      .page{width:min(100% - 24px,860px);padding:56px 0}.top{align-items:flex-start;flex-direction:column}.controls{width:100%}
      .directory.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.directory.cards .profile{padding:7px 7px 13px;border-radius:14px}.directory.cards .content{padding:12px 2px 0}.directory.cards .focus{display:none}.directory.cards .side{margin:11px 2px 0;padding-top:10px;gap:5px}.directory.cards .side span{display:none}
      .directory.list .profile{grid-template-columns:58px minmax(0,1fr);gap:12px;min-height:78px}.directory.list .portrait{width:58px;height:58px}.directory.list .side{display:none}
    }
    @media(prefers-reduced-motion:reduce){.indicator{transition-duration:1ms}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation-duration:1ms}}
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div><h1>Psicólogos</h1><div class="count" id="count">Cargando perfiles…</div></div>
      <div class="controls" id="controls" data-view="list" role="group" aria-label="Vista de resultados">
        <span class="indicator" aria-hidden="true"></span>
        <button class="view-button active" data-view="list">Lista</button>
        <button class="view-button" data-view="cards">Tarjetas</button>
      </div>
    </header>
    <section class="directory list" id="directory" aria-live="polite"></section>
    <button class="load" id="load">Mostrar más</button>
    <p class="hint">Cambia de vista varias veces para evaluar la transición.</p>
  </main>
  <script src="/psicologos/data/psicologos_web.js"></script>
  <script>
  (()=>{
    const profiles=(window.PSICOLOGOS||[]).map((p,id)=>({...p,id})).sort((a,b)=>Number(b.o)-Number(a.o)||Number(b.r)-Number(a.r));
    const directory=document.querySelector('#directory'),controls=document.querySelector('#controls'),count=document.querySelector('#count'),load=document.querySelector('#load');
    const fmt=new Intl.NumberFormat('es-CL');let view='list',visible=12,changing=false;
    const palettes=[['#376c5b','#ffb45d','#ef766e'],['#435a8b','#e9a8bd','#e7c96b'],['#744c78','#dc805e','#8ac1a2'],['#3f7778','#edc75b','#da6c7d'],['#91654b','#8dbbb2','#e0a067'],['#4f6387','#d98c79','#9aba7d']];
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const initials=n=>String(n||'').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
    const hash=s=>[...String(s)].reduce((a,c)=>((a<<5)-a+c.charCodeAt(0))|0,0);
    const price=p=>Number.isFinite(p)&&p>=5000&&p<=300000?'$'+fmt.format(p):'Sin precio';
    function card(p){const colors=palettes[Math.abs(hash(p.n))%palettes.length],place=[p.on?'Online':'',p.c].filter(Boolean).join(' · ')||'Modalidad no indicada',focus=p.t||p.s||'Áreas de atención no detalladas';return `<article class="profile" style="view-transition-name:profile-${p.id}"><div class="portrait" style="--tone:${colors[0]};--tone-2:${colors[1]};--tone-3:${colors[2]};--turn:${(Math.abs(hash(p.n))%42)-21}deg"><span class="initials">${esc(initials(p.n))}</span></div><div class="content"><h2 class="name">${esc(p.n)}</h2><p class="place">${esc(place)}</p><p class="focus">${esc(focus)}</p></div><div class="side"><span>${esc(price(p.p))}</span><a class="profile-link" href="${esc(p.u)}" target="_blank" rel="noopener noreferrer">Ver perfil ↗</a></div></article>`}
    function render(){const shown=profiles.slice(0,visible);directory.innerHTML=shown.map(card).join('');count.textContent=`${fmt.format(profiles.length)} perfiles · mostrando ${shown.length}`;load.hidden=shown.length>=profiles.length}
    async function setView(next){if(next===view||changing)return;changing=true;const update=()=>{view=next;directory.className=`directory ${view}`;controls.dataset.view=view;controls.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render()};if(document.startViewTransition){const transition=document.startViewTransition(update);try{await transition.finished}catch(_){}}else update();changing=false}
    controls.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)});load.addEventListener('click',()=>{visible+=12;render()});render();
  })();
  </script>
</body>
</html>
