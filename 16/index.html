<main role="img" aria-label="Escultura esférica de pliegues granulados blancos y bandas negras, que gira lentamente alrededor de un núcleo luminoso. Una pequeña silueta y dos líneas finas marcan el centro.">
  <canvas id="space" aria-hidden="true"></canvas>
  <canvas id="sculpture" aria-hidden="true"></canvas>
  <canvas id="details" aria-hidden="true"></canvas>
