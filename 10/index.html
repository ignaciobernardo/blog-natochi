<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f8f5">
  <title>La tarde y la montaña — natochi</title>
  <meta name="description" content="Montañas generadas con tinta y un haiku de Jorge Luis Borges.">
  <link rel="icon" href="/favicon.svg">
  <style>
    * { box-sizing: border-box; }
    html { background: #f8f8f5; color: #252621; }
    body { margin: 0; min-height: 100svh; }
    main { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 42px 20px 32px; }
    figure { margin: 0; width: min(660px, 100%); }
    canvas { display: block; width: 100%; aspect-ratio: 760 / 450; }
    blockquote { margin: 20px 0 0; text-align: center; font: 18px/1.8 Georgia, 'Times New Roman', serif; font-weight: 400; }
    blockquote p { margin: 0; }
    cite { display: block; margin-top: 20px; font: normal 9px/1.6 'Courier New', monospace; letter-spacing: .16em; text-transform: uppercase; color: #777870; }
    cite a { color: inherit; text-decoration: none; }
    cite a:hover { color: #252621; }
    button { margin-top: 38px; padding: 9px 12px; border: 0; background: transparent; color: #94958e; font: 10px 'Courier New', monospace; cursor: pointer; letter-spacing: .06em; }
    button:hover { color: #252621; }
    :focus-visible { outline: 1px solid #777870; outline-offset: 5px; }
    @media (max-width: 540px) { main { padding: 28px 15px; } blockquote { margin-top: 24px; font-size: 16px; } }
  </style>
</head>
<body>
  <main>
    <figure aria-label="Cordillera procedural dibujada con líneas finas de tinta negra sobre papel claro">
      <canvas role="img" aria-label="Montañas de tinta, un paisaje nuevo en cada visita"></canvas>
    </figure>
    <blockquote>
      <p>Algo me han dicho<br>la tarde y la montaña.<br>Ya lo he perdido.</p>
      <cite><a href="https://terebess.hu/english/haiku/borges.html" target="_blank" rel="noopener noreferrer">Jorge Luis Borges</a></cite>
    </blockquote>
    <button type="button" aria-label="Generar otro paisaje de montañas">otro paisaje ↗</button>
  </main>
  <script src="./mountains.js"></script>
</body>
</html>
