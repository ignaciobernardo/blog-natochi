<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermal Ring — natochi</title>
<meta name="description" content="Un anillo térmico procedural en transformación continua.">
<meta name="theme-color" content="#fffefa">
<link rel="icon" href="../favicon.svg">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #fffefa; color: #303426; }
body { min-height: 100svh; display: grid; place-items: center; font-family: 'Courier New', monospace; }
main { position: relative; width: min(100vw, 100svh); aspect-ratio: 1; }
canvas { width: 100%; height: 100%; display: block; }
.label { position: absolute; font-size: clamp(7px, 1.2vmin, 10px); line-height: 1.3; letter-spacing: .13em; text-transform: uppercase; }
.specimen { top: 4%; left: 4%; background: #f1f5d6; padding: 5px 7px; }
.project { right: 4%; top: 6%; font-size: clamp(6px, 1vmin, 9px); }
.center { top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
.name { background: #f1f5d6; display: inline-block; padding: 4px 7px; }
.stack { margin-top: 15px; font-size: .85em; }
.frame { margin-top: 15px; font-size: .8em; }
.measure { bottom: 4%; left: 4%; }
.year { bottom: 4%; left: 34%; }
button { position: absolute; right: 4%; bottom: 3%; padding: 8px; border: 0; background: none; color: inherit; font: 22px Georgia, serif; cursor: pointer; }
button:hover { transform: rotate(25deg); }
button:focus-visible { outline: 1px solid #9dbecc; outline-offset: 2px; }
</style>
</head>
<body>
<main aria-label="Estudio térmico procedural">
  <canvas aria-label="Anillo naranja difuminado con núcleos azules, celestes y amarillos, que se transforma lentamente" role="img"></canvas>
  <div class="label specimen">Specimen ring <span id="specimen">01</span><br>8 sites / unresolved</div>
  <div class="label project">Proj :: thermal cascade</div>
  <div class="label center"><div class="name">Natochi<br>Thermal · spectral</div><div class="stack">[ Z-stack ]<br>Morph — frame</div><div class="frame"><span id="frame">0</span>/1000</div></div>
  <div class="label measure">Ø 340mm</div><div class="label year">2026</div>
  <button aria-label="Generar otro anillo" title="Generar otro anillo">↺</button>
</main>
<script src="./thermal.js"></script>
</body>
</html>
